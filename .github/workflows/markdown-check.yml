name: Markdown Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".markdownlint.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/markdown-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".markdownlint.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/markdown-check.yml"

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Markdown lint
        run: npm run lint:md
